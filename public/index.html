<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çoklu Bot Paneli</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1e1e1e; color: #fff; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; background: #2d2d2d; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .btn { padding: 8px 15px; cursor: pointer; border: none; border-radius: 4px; color: white; }
        .btn-green { background: #28a745; } .btn-red { background: #dc3545; } .btn-blue { background: #007bff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        .card { background: #2d2d2d; padding: 15px; border-radius: 8px; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 10px; background: #444; border: 1px solid #555; color: white; box-sizing: border-box; }
        .terminal { background: #000; color: #0f0; height: 150px; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 12px; margin-bottom: 10px; }
        .flex-row { display: flex; gap: 10px; }
        .data-box { background: #111; padding: 5px; font-size: 11px; height: 100px; overflow-y: auto; margin-top: 10px;}
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2>Bot Kontrol Paneli</h2>
            <p>Toplam Kayıtlı Bot: <span id="total-bots">0</span> | Aktif Bot: <span id="active-bots">0</span></p>
        </div>
        <div>
            <button class="btn btn-green" onclick="socket.emit('start_all')">Tümünü Başlat</button>
            <button class="btn btn-red" onclick="socket.emit('stop_all')">Tümünü Durdur</button>
            <button class="btn btn-blue" onclick="addNewBot()">Yeni Bot Ekle</button>
        </div>
    </div>

    <!-- GLOBAL TERMİNAL -->
    <div class="card" style="margin-bottom: 20px;">
        <h3>Global Terminal (Tüm Botlara Gönder)</h3>
        <div id="global-terminal" class="terminal"></div>
        <div class="flex-row">
            <input type="text" id="global-cmd" placeholder="Tüm botlar için komut/mesaj yazın...">
            <button class="btn btn-blue" onclick="sendGlobalCmd()">Gönder</button>
        </div>
    </div>

    <!-- BOTLARIN LİSTELENDİĞİ ALAN -->
    <div id="bots-container" class="grid"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let bots = {};

        socket.on('init_data', (data) => {
            bots = data;
            document.getElementById('total-bots').innerText = Object.keys(bots).length;
            renderBots();
        });

        socket.on('bot_status', (data) => {
            const statusEl = document.getElementById(`status-${data.id}`);
            if(statusEl) statusEl.innerText = data.status;
            statusEl.style.color = data.status === 'Online' ? '#28a745' : '#dc3545';
        });

        socket.on('terminal_log', (data) => {
            const termId = data.id === 'all' ? 'global-terminal' : `term-${data.id}`;
            const term = document.getElementById(termId);
            if(term) {
                term.innerHTML += `<div>${data.msg}</div>`;
                term.scrollTop = term.scrollHeight;
            }
        });

        socket.on('uptime_update', (uptimes) => {
            document.getElementById('active-bots').innerText = Object.keys(uptimes).length;
            for(let id in uptimes) {
                const el = document.getElementById(`uptime-${id}`);
                if(el) el.innerText = uptimes[id];
            }
        });

        function addNewBot() {
            const id = 'bot_' + Date.now();
            bots[id] = { id, ip: '', version: '1.20.6', login: '', subServer: '', autoReconnect: true };
            saveBot(id);
        }

        function saveBot(id) {
            const botData = bots[id] || { id };
            if(document.getElementById(`ip-${id}`)) {
                botData.ip = document.getElementById(`ip-${id}`).value;
                botData.version = document.getElementById(`ver-${id}`).value;
                botData.login = document.getElementById(`login-${id}`).value;
                botData.subServer = document.getElementById(`sub-${id}`).value;
            }
            socket.emit('save_bot', botData);
        }

        function sendBotCmd(id) {
            const cmd = document.getElementById(`cmd-${id}`).value;
            socket.emit('send_command', { target: id, command: cmd });
            document.getElementById(`cmd-${id}`).value = '';
        }

        function sendGlobalCmd() {
            const cmd = document.getElementById('global-cmd').value;
            socket.emit('send_command', { target: 'all', command: cmd });
            document.getElementById('global-cmd').value = '';
        }

        function renderBots() {
            const container = document.getElementById('bots-container');
            container.innerHTML = '';
            for (let id in bots) {
                const b = bots[id];
                container.innerHTML += `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between;">
                            <h3>Bot: ${b.login || 'Yeni Bot'}</h3>
                            <span id="status-${id}" style="color:red; font-weight:bold;">Offline</span>
                        </div>
                        <p style="font-size: 12px;">Süre: <span id="uptime-${id}" style="color:#0dcaf0;">0s 0dk</span></p>
                        
                        <div class="flex-row">
                            <input type="text" id="login-${id}" placeholder="Kullanıcı Adı" value="${b.login}" onchange="saveBot('${id}')">
                            <input type="text" id="ver-${id}" placeholder="Sürüm (örn: 1.21.11)" value="${b.version}" onchange="saveBot('${id}')">
                        </div>
                        <input type="text" id="ip-${id}" placeholder="Sunucu IP" value="${b.ip}" onchange="saveBot('${id}')">
                        <input type="text" id="sub-${id}" placeholder="Alt Sunucu Adı (Örn: faction) - /gir komutu ile girer" value="${b.subServer || ''}" onchange="saveBot('${id}')">
                        
                        <div class="flex-row" style="margin-bottom:10px;">
                            <button class="btn btn-green" style="flex:1;" onclick="socket.emit('start_bot', '${id}')">Başlat</button>
                            <button class="btn btn-red" style="flex:1;" onclick="socket.emit('stop_bot', '${id}')">Durdur</button>
                        </div>
                        
                        <strong>Terminal</strong>
                        <div id="term-${id}" class="terminal"></div>
                        <div class="flex-row">
                            <input type="text" id="cmd-${id}" placeholder="Komut...">
                            <button class="btn btn-blue" onclick="sendBotCmd('${id}')">Yaz</button>
                        </div>

                        <div class="flex-row">
                            <div style="flex:1">
                                <strong>Tab Listesi & Scoreboard</strong>
                                <div id="tab-${id}" class="data-box">Veri bekleniyor...</div>
                            </div>
                            <div style="flex:1">
                                <strong>Radar</strong>
                                <div id="radar-${id}" class="data-box">Kimse yok</div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }
    </script>
</body>
  </html>
