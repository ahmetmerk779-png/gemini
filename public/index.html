<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelişmiş Bot Yönetim Paneli</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #0f111a;
            --panel-bg: #1a1d2d;
            --primary: #00d2ff;
            --danger: #ff4b4b;
            --success: #00e676;
            --text-main: #e2e8f0;
            --border: #2d324a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .header h1 { font-size: 24px; color: var(--primary); }
        
        /* Genel Bağlantı Kontrolleri */
        .global-controls { background: var(--panel-bg); padding: 20px; border-radius: 10px; display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; border: 1px solid var(--border); margin-bottom: 30px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 13px; color: #94a3b8; }
        input { background: #0f111a; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 5px; outline: none; }
        input:focus { border-color: var(--primary); }
        
        button { background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { opacity: 0.8; }
        button.btn-danger { background: var(--danger); color: white; }
        button.btn-action { background: #2d324a; color: white; border: 1px solid var(--border); padding: 8px 15px; }
        button.btn-action:hover { background: #3f4666; }

        /* Bot Kartları Grid Yapısı */
        #bots-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        
        .bot-card { background: var(--panel-bg); border-radius: 10px; border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
        .bot-header { padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); }
        .bot-name { font-weight: bold; font-size: 16px; display: flex; align-items: center; gap: 10px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: gray; }
        .status-dot.online { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .status-dot.error { background: var(--danger); }
        
        /* Bota Özel Araç Çubuğu */
        .bot-toolbar { padding: 10px 15px; display: flex; gap: 10px; background: rgba(255,255,255,0.02); flex-wrap: wrap;}
        
        /* Bota Özel Terminal */
        .bot-terminal { background: #090a0f; padding: 15px; height: 180px; overflow-y: auto; font-family: monospace; font-size: 13px; color: #a9b7c6; display: flex; flex-direction: column; gap: 5px; }
        .bot-terminal span { word-wrap: break-word; }
        .bot-input-area { display: flex; padding: 10px; background: var(--panel-bg); border-top: 1px solid var(--border); }
        .bot-input-area input { flex: 1; border-radius: 5px 0 0 5px; border-right: none; }
        .bot-input-area button { border-radius: 0 5px 5px 0; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Gelişmiş Bot Paneli</h1>
        <button class="btn-danger" onclick="stopAllBots()">Tüm Botları Kapat</button>
    </div>

    <!-- Bağlantı Ayarları -->
    <div class="global-controls">
        <div class="input-group">
            <label>Sunucu IP</label>
            <input type="text" id="serverIp" placeholder="mc.sunucu.com">
        </div>
        <div class="input-group">
            <label>Port</label>
            <input type="number" id="serverPort" value="25565" style="width: 100px;">
        </div>
        <div class="input-group">
            <label>Bot Kullanıcı Adı</label>
            <input type="text" id="botUsername" placeholder="Bot_01">
        </div>
        <button onclick="startBot()">Botu Oyuna Sok</button>
    </div>

    <!-- Botların Ekleneceği Kısım -->
    <div id="bots-container"></div>

    <script>
        const socket = io();

        function startBot() {
            const host = document.getElementById('serverIp').value;
            const port = document.getElementById('serverPort').value;
            const username = document.getElementById('botUsername').value;

            if (!host || !username) return alert('Lütfen IP ve Kullanıcı Adı girin!');

            socket.emit('startBot', { host, port, username });
            createBotCard(username);
            document.getElementById('botUsername').value = ""; // Inputu temizle
        }

        function createBotCard(username) {
            if (document.getElementById(`card-${username}`)) return; // Kart zaten varsa ekleme

            const container = document.getElementById('bots-container');
            const card = document.createElement('div');
            card.className = 'bot-card';
            card.id = `card-${username}`;
            
            card.innerHTML = `
                <div class="bot-header">
                    <div class="bot-name">
                        <div class="status-dot" id="status-${username}"></div>
                        ${username}
                    </div>
                    <button class="btn-danger" style="padding: 5px 10px; font-size: 12px;" onclick="stopBot('${username}')">X Kapat</button>
                </div>
                <div class="bot-toolbar">
                    <button class="btn-action" onclick="sendCommand('${username}', '/gir pvp')">/gir pvp</button>
                    <button class="btn-action" onclick="sendCommand('${username}', '/gir faction')">/gir faction</button>
                    <button class="btn-action" id="afkBtn-${username}" onclick="toggleAfk('${username}')">AFK Koruma: KAPALI</button>
                </div>
                <div class="bot-terminal" id="terminal-${username}">
                    <span>[Sistem] Bot başlatılıyor...</span>
                </div>
                <div class="bot-input-area">
                    <input type="text" id="input-${username}" placeholder="/komut veya mesaj..." onkeypress="handleEnter(event, '${username}')">
                    <button onclick="sendManualCommand('${username}')">Gönder</button>
                </div>
            `;
            container.appendChild(card);
        }

        // Bota özel komut gönderme
        function sendCommand(username, command) {
            socket.emit('sendCommand', { username, command });
        }

        // Input alanından manuel komut gönderme
        function sendManualCommand(username) {
            const input = document.getElementById(`input-${username}`);
            if (input.value.trim() !== '') {
                sendCommand(username, input.value);
                input.value = '';
            }
        }

        function handleEnter(e, username) {
            if (e.key === 'Enter') sendManualCommand(username);
        }

        function stopBot(username) {
            socket.emit('stopBot', username);
            document.getElementById(`card-${username}`).remove();
        }

        function stopAllBots() {
            if(confirm("Bütün botları sunucudan çıkarmak istiyor musunuz?")) {
                socket.emit('stopAll');
                document.getElementById('bots-container').innerHTML = '';
            }
        }

        // AFK koruması butonu durumu (Aç/Kapat mantığı)
        const afkStates = {};
        function toggleAfk(username) {
            afkStates[username] = !afkStates[username];
            const btn = document.getElementById(`afkBtn-${username}`);
            if(afkStates[username]) {
                btn.innerText = "AFK Koruma: AÇIK";
                btn.style.borderColor = "var(--success)";
                btn.style.color = "var(--success)";
            } else {
                btn.innerText = "AFK Koruma: KAPALI";
                btn.style.borderColor = "var(--border)";
                btn.style.color = "white";
            }
            socket.emit('toggleAfk', { username, state: afkStates[username] });
        }

        // Socket dinleyicileri (Logları ilgili bota yazdırır)
        socket.on('botLog', ({ username, msg }) => {
            const terminal = document.getElementById(`terminal-${username}`);
            if (terminal) {
                const span = document.createElement('span');
                span.innerText = msg;
                terminal.appendChild(span);
                terminal.scrollTop = terminal.scrollHeight; // Otomatik aşağı kaydır
            }
        });

        // Durum göstergesini (Kırmızı/Yeşil Nokta) güncelle
        socket.on('botStatus', ({ username, status }) => {
            const dot = document.getElementById(`status-${username}`);
            if (dot) {
                dot.className = 'status-dot'; // Sınıfları sıfırla
                if (status === 'online') dot.classList.add('online');
                else if (status === 'error') dot.classList.add('error');
            }
        });
    </script>
</body>
</html>
